apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanso-web
spec:
  ingressClassName: traefik
  rules:
    - host: kanso.localhost          # overlays patch this
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanso-web
                port:
                  number: 80
