# Manual button: roll one app in one environment back to its previous version.
name: Rollback
run-name: Roll back ${{ inputs.app }} in ${{ inputs.env }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: App (folder in apps/)
        type: string
        required: true
      env:
        description: Environment
        type: choice
        options: [staging, prod]

permissions:
  contents: read

env:
  APP: ${{ inputs.app }}
  ENV: ${{ inputs.env }}

jobs:
  rollback:
    runs-on: [self-hosted, k3s-local]
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    defaults:
      run:
        # Git Bash explicitly (plain `bash` here is WSL). 8.3 short path: the runner cannot parse a quoted path with spaces
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Pick the app's deployer secret
        id: key
        run: |
          [[ "${APP}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Bad app name: ${APP}" >&2; exit 2; }
          echo "secret=DEPLOYER_KUBECONFIG_$(printf '%s' "${APP}" | tr 'a-z-' 'A-Z_')" >> "${GITHUB_OUTPUT}"

      - name: Roll back
        env:
          KUBECONFIG_CONTENT: ${{ secrets[steps.key.outputs.secret] }}
        run: |
          [ -n "${KUBECONFIG_CONTENT}" ] || { echo "Secret ${{ steps.key.outputs.secret }} is not set" >&2; exit 1; }
          export DEPLOYER_KUBECONFIG="${RUNNER_TEMP}/deployer.kubeconfig"
          (umask 077; printf '%s' "${KUBECONFIG_CONTENT}" > "${DEPLOYER_KUBECONFIG}")
          scripts/rollback.sh "${APP}" "${ENV}"

      - name: Clean up
        if: always()
        run: rm -f "${RUNNER_TEMP}/deployer.kubeconfig"
