# Roll one app in one environment to an image — the GitLab twin of .github/workflows/.
# Only two things create a pipeline here: an app repo's trigger token (app repos build their
# image, then trigger this project), or "Run pipeline" in the UI (the Actions-tab equivalent).
# A plain git push creates no pipeline. Variables: APP, ENV, IMAGE, SOURCE (optional),
# ACTION (deploy, or rollback for scripts/rollback.sh).
# prod is a manual job: a Maintainer presses play. The keys live in Settings > CI/CD >
# Variables as Protected *file* variables scoped to the staging/prod environments, so only
# pipelines on the protected main ref — and only the job bound to that environment — get them.
# The runner is this project's group runner on the cluster PC (tags k3s-staging, k3s-prod);
# it runs PowerShell, so each job is one line that hands off to Git Bash (8.3 path: a quoted
# path with spaces does not survive the runner's command parsing).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"

# Each job clears BASH_ENV first: non-interactive bash expands it (command substitution
# included) before the script runs, and a trigger can set any variable it likes.
# resource_group serializes runs per app+env, like the GitHub workflows' concurrency groups.

deploy-staging:
  rules:
    - if: $ACTION != "rollback" && $ENV == "staging"
  tags: [k3s-staging]
  resource_group: "deploy-${APP}-${ENV}"
  environment:
    name: staging
  variables:
    ACTION: deploy
  script:
    - $env:BASH_ENV=$null; C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail ci/gitlab-job.sh

deploy-prod:
  rules:
    - if: $ACTION != "rollback" && $ENV == "prod"
      when: manual
  tags: [k3s-prod]
  resource_group: "deploy-${APP}-${ENV}"
  environment:
    name: prod
  variables:
    ACTION: deploy
  script:
    - $env:BASH_ENV=$null; C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail ci/gitlab-job.sh

rollback:
  rules:
    - if: $ACTION == "rollback"
      when: manual
  tags: ["k3s-${ENV}"]
  resource_group: "deploy-${APP}-${ENV}"
  environment:
    name: "${ENV}"
  script:
    - $env:BASH_ENV=$null; C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail ci/gitlab-job.sh
