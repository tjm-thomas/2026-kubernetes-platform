# Two single-node k3s clusters (control plane + worker each) running in Docker:
# k3s runs prod (API 6443, ingress 8081), k3s-staging runs staging (API 6444, ingress 8082).
# Run from cluster/: docker compose up -d, then ../scripts/setup.sh
name: kubernetes

services:
  k3s:
    image: rancher/k3s:v1.36.5-k3s1
    container_name: k3s
    hostname: k3s          # fixed node name: a recreated container must not become a new node
    command: server --tls-san=127.0.0.1
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./kubeconfig:/output             # admin kubeconfig (git-ignored, a secret)
    ports:
      - "6443:6443"                      # Kubernetes API (kubectl)
      - "${K3S_HTTP_PORT:-8081}:80"      # Traefik ingress: *.localhost

  k3s-staging:
    image: rancher/k3s:v1.36.5-k3s1
    container_name: k3s-staging
    hostname: k3s-staging
    # API on 6444 inside too, so the kubeconfig k3s writes has the right port
    command: server --tls-san=127.0.0.1 --https-listen-port=6444
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/staging.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-staging-data:/var/lib/rancher/k3s
      - ./kubeconfig:/output
    ports:
      - "6444:6444"
      - "${K3S_STAGING_HTTP_PORT:-8082}:80"

volumes:
  k3s-data:
  k3s-staging-data:
