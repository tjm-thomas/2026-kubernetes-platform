# Single-node k3s cluster (control plane + worker) running in Docker.
# Run from cluster/: docker compose up -d, then ../scripts/setup.sh
name: kubernetes

services:
  k3s:
    image: rancher/k3s:v1.36.5-k3s1
    container_name: k3s
    command: server --tls-san=127.0.0.1
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./kubeconfig:/output             # admin kubeconfig (git-ignored, a secret)
      - ..:/platform:ro                  # whole repo, so setup can apply cluster/ and apps/ manifests
    ports:
      - "6443:6443"                      # Kubernetes API (kubectl)
      - "${K3S_HTTP_PORT:-8081}:80"      # Traefik ingress: *.localhost

volumes:
  k3s-data:
