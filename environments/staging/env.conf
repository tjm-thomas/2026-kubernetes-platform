NAMESPACE=kanso-staging
HOST=staging.kanso.localhost
# yes: setup.sh creates Secret basic-auth (user = environment name),
# password in .secrets/staging-password.txt
BASIC_AUTH=yes

# The cluster this environment runs on. Admin access is a container (local k3s in Docker),
# or, when CLUSTER_CONTAINER is empty, an admin kubeconfig (path from the repo root, e.g. a VM).
CLUSTER_CONTAINER=k3s-staging
CLUSTER_ADMIN_KUBECONFIG=
# API address written into deploy keys
API_SERVER=https://127.0.0.1:6444
# Headlamp (cluster web UI) hostname. Must differ from prod: browsers share cookies across
# ports, so the same hostname would make the two logins overwrite each other.
HEADLAMP_HOST=staging.kubernetes.localhost
