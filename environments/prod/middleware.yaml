# Applied to every app's Ingress in this environment. Prod is public, so this only
# tags responses; every environment has an `env` middleware so the Ingress is the same.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: env
  namespace: kanso-prod
spec:
  headers:
    customResponseHeaders:
      X-Environment: prod
